<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#111111"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid lines (subtle) -->
  <g stroke="#1a1a1a" stroke-width="1" opacity="0.6">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Neon accent bar (left) -->
  <rect x="60" y="180" width="4" height="270" fill="#D4FF00" filter="url(#glow)" rx="2"/>

  <!-- Code block decoration (right side) -->
  <g transform="translate(720, 160)" opacity="0.15">
    <rect x="0" y="0" width="360" height="240" rx="8" fill="none" stroke="#D4FF00" stroke-width="1"/>
    <rect x="0" y="0" width="360" height="32" rx="8" fill="#D4FF00" opacity="0.08"/>
    <circle cx="20" cy="16" r="5" fill="#ff5f57"/>
    <circle cx="40" cy="16" r="5" fill="#febc2e"/>
    <circle cx="60" cy="16" r="5" fill="#28c840"/>
    <text x="16" y="65" font-family="monospace" font-size="13" fill="#D4FF00" opacity="0.7">from legaldev import LegalAPI</text>
    <text x="16" y="90" font-family="monospace" font-size="13" fill="#888" opacity="0.9">api = LegalAPI()</text>
    <text x="16" y="115" font-family="monospace" font-size="13" fill="#888" opacity="0.9">result = api.check(</text>
    <text x="16" y="140" font-family="monospace" font-size="13" fill="#888" opacity="0.9">  project_type="SaaS",</text>
    <text x="16" y="165" font-family="monospace" font-size="13" fill="#888" opacity="0.9">  handles_personal_data=True</text>
    <text x="16" y="190" font-family="monospace" font-size="13" fill="#888" opacity="0.9">)</text>
    <text x="16" y="220" font-family="monospace" font-size="13" fill="#D4FF00" opacity="0.7"># → RGPD, EU AI Act, LOPDGDD</text>
  </g>

  <!-- Decorative horizontal lines (left content area) -->
  <line x1="82" y1="200" x2="340" y2="200" stroke="#D4FF00" stroke-width="1" opacity="0.3"/>
  <line x1="82" y1="430" x2="280" y2="430" stroke="#D4FF00" stroke-width="1" opacity="0.2"/>

  <!-- Main title -->
  <text x="88" y="310" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="96" fill="#ffffff" letter-spacing="-2">LegalDev</text>

  <!-- Subtitle -->
  <text x="90" y="365" font-family="'Courier New', monospace" font-size="22" fill="#D4FF00" letter-spacing="4" filter="url(#glow)">API RAG · Legal</text>

  <!-- Tag chips -->
  <g transform="translate(90, 390)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="88" height="28" rx="4" fill="none" stroke="#D4FF00" stroke-width="1" opacity="0.4"/>
    <text x="10" y="18" font-family="monospace" font-size="11" fill="#D4FF00" opacity="0.8">FastAPI</text>
    <!-- Chip 2 -->
    <rect x="100" y="0" width="98" height="28" rx="4" fill="none" stroke="#D4FF00" stroke-width="1" opacity="0.4"/>
    <text x="110" y="18" font-family="monospace" font-size="11" fill="#D4FF00" opacity="0.8">ChromaDB</text>
    <!-- Chip 3 -->
    <rect x="210" y="0" width="80" height="28" rx="4" fill="none" stroke="#D4FF00" stroke-width="1" opacity="0.4"/>
    <text x="220" y="18" font-family="monospace" font-size="11" fill="#D4FF00" opacity="0.8">Docker</text>
    <!-- Chip 4 -->
    <rect x="302" y="0" width="98" height="28" rx="4" fill="none" stroke="#D4FF00" stroke-width="1" opacity="0.4"/>
    <text x="312" y="18" font-family="monospace" font-size="11" fill="#D4FF00" opacity="0.8">LangChain</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="600" width="1200" height="30" fill="#D4FF00" opacity="0.05"/>
  <text x="90" y="621" font-family="monospace" font-size="11" fill="#D4FF00" opacity="0.4" letter-spacing="3">RGPD · EU AI ACT · LOPDGDD · AEPD</text>
</svg>
